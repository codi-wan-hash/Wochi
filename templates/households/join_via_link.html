{% extends "base.html" %}

{% block title %}Einladung · Wochii{% endblock %}

{% block content %}
<div class="container mt-5" style="max-width: 480px;">
    <div class="card shadow-sm border-0 rounded-4 text-center p-4">
        <div style="font-size: 3rem;" aria-hidden="true">🏠</div>
        <h1 class="h2 fw-bold mt-3 mb-1">Einladung</h1>
        <p class="text-muted mb-4">Du wurdest eingeladen, diesem Haushalt beizutreten:</p>
        <p class="h4 fw-bold mb-4">„{{ household.name }}“</p>

        <form method="post">
            {% csrf_token %}
            <button type="submit" class="btn btn-dark btn-lg w-100">Jetzt beitreten</button>
        </form>
        <p class="small text-muted mt-3 mb-0">Du bist angemeldet als <strong>{{ user.username }}</strong>.</p>
        <a href="{% url 'home' %}" class="btn btn-link mt-2 text-muted">Abbrechen</a>
    </div>
</div>
{% endblock %}
