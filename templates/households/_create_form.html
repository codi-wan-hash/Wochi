{# Formular „Haushalt anlegen“ (Ersteinrichtung und Haushaltsseite). Erwartet create_form. #}
<form method="post">
    {% csrf_token %}
    <input type="hidden" name="action" value="create">
    <div class="mb-3">
        <label for="{{ create_form.name.id_for_label }}" class="form-label">{{ create_form.name.label }}</label>
        {{ create_form.name }}
        {% if create_form.name.errors %}
        <div class="invalid-feedback d-block" id="{{ create_form.name.auto_id }}_error">{{ create_form.name.errors|join:" " }}</div>
        {% endif %}
    </div>
    <button type="submit" class="btn btn-dark">Haushalt erstellen</button>
</form>
