<li class="shop-item{% if item.is_bought %} is-bought{% endif %}" id="item-{{ item.pk }}"
    data-id="{{ item.pk }}" data-name="{{ item.name }}" data-quantity="{{ item.quantity }}">
    <button type="button" class="shop-item-toggle" data-url="{% url 'shopping_toggle_bought' item.pk %}"
            aria-pressed="{{ item.is_bought|yesno:'true,false' }}">
        <span class="shop-check" aria-hidden="true"></span>
        <span class="shop-item-text">
            <span class="shop-item-name">{{ item.name }}</span>
            {% if item.quantity %}<span class="shop-item-qty">{{ item.quantity }}</span>{% endif %}
            {% if item.added_by %}<span class="shop-item-by">{{ item.added_by.username }}</span>{% endif %}
        </span>
    </button>
    <a class="shop-item-action" href="{% url 'shopping_update' item.pk %}" aria-label="„{{ item.name }}“ bearbeiten"><svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20h4L19 9a2.8 2.8 0 0 0-4-4L4 16z"/><path d="m13.5 6.5 4 4"/></svg></a>
    <button type="button" class="shop-item-action shop-item-delete" data-url="{% url 'shopping_delete' item.pk %}"
            aria-label="„{{ item.name }}“ löschen">✕</button>
</li>
