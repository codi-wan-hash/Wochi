{# Eine Zeile der Zutatenliste. Ohne ingredient dient sie als Vorlage (<template>), die das Seiten-Skript per textContent befüllt. #}
<li class="list-group-item ingredient-row"{% if ingredient %} id="ingredient-{{ ingredient.pk }}"
    data-name="{{ ingredient.name }}"
    data-quantity="{{ ingredient.quantity }}"
    data-scale-url="{% url 'ingredient_scale' ingredient.pk %}"
    data-shopping-url="{% url 'ingredient_to_shopping' ingredient.pk %}"
    data-delete-url="{% url 'ingredient_delete' ingredient.pk %}"{% endif %}>
    <div class="d-flex justify-content-between align-items-center gap-2">
        <span class="d-flex align-items-center flex-wrap gap-2 flex-grow-1">
            <span class="ingredient-name">{{ ingredient.name }}</span>
            <button type="button" class="qty-display" title="Menge anpassen">
                <span class="qty-value">{% if ingredient.quantity %}{{ ingredient.quantity }}{% else %}—{% endif %}</span>
                <span class="visually-hidden">– Menge ändern</span>
            </button>
        </span>
        <span class="d-flex gap-1 flex-shrink-0">
            <button type="button" class="btn btn-sm btn-outline-success py-0 px-2 btn-to-shopping"
                    title="In Einkaufsliste" aria-label="{{ ingredient.name }} auf die Einkaufsliste">+</button>
            <button type="button" class="btn btn-sm btn-outline-danger py-0 px-2 btn-delete-ingredient"
                    title="Entfernen" aria-label="{{ ingredient.name }} entfernen">✕</button>
        </span>
    </div>
</li>
