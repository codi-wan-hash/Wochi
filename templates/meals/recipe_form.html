{% extends "base.html" %}
{% load static %}

{% block title %}{{ title }} · Wochii{% endblock %}

{% block extra_head %}<link rel="stylesheet" href="{% static 'css/meals.css' %}">{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-8 col-lg-6">
        <div class="card shadow-sm border-0 rounded-4">
            <div class="card-body p-4">
                <h1 class="h3 mb-4">{{ title }}</h1>

                <form method="post">
                    {% csrf_token %}
                    {% include "meals/_form_fields.html" %}

                    <div class="d-flex gap-2 mt-3">
                        <button type="submit" class="btn btn-dark">Speichern</button>
                        <a href="{% url 'recipe_list' %}" class="btn btn-outline-secondary">Abbrechen</a>
                        {% if recipe %}
                            <a href="{% url 'recipe_delete' recipe.pk %}" class="btn btn-outline-danger ms-auto">Löschen</a>
                        {% endif %}
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
