{% extends "base.html" %}

{% block content %}
<div class="col-md-5">
    <div class="card shadow-sm border-0 rounded-4">
        <div class="card-body p-4">
            <h2 class="mb-4">Anmelden</h2>

            <form method="post">
                {% csrf_token %}

                {% for field in form %}
                <div class="mb-3">
                    <label for="{{ field.id_for_label }}" class="form-label fw-semibold">
                        {{ field.label }}
                    </label>
                    <input
                        type="{{ field.field.widget.input_type }}"
                        name="{{ field.html_name }}"
                        id="{{ field.id_for_label }}"
                        class="form-control{% if field.errors %} is-invalid{% endif %}"
                        {% if field.value %}value="{{ field.value }}"{% endif %}
                        autocomplete="{{ field.html_name }}"
                    >
                    {% for error in field.errors %}
                        <div class="invalid-feedback">{{ error }}</div>
                    {% endfor %}
                </div>
                {% endfor %}

                {% if form.non_field_errors %}
                <div class="alert alert-danger py-2">{{ form.non_field_errors }}</div>
                {% endif %}

                <button type="submit" class="btn btn-dark w-100 mt-2">Anmelden</button>
            </form>

            <p class="mt-3 text-center">
                Noch kein Konto?
                <a href="{% url 'register' %}">Jetzt registrieren</a>
            </p>
        </div>
    </div>
</div>
{% endblock %}
